<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" 
		content="width=device-width, initial-scale=1.0">
	<title>Exemplo Elementos Inline</title>
	<style>
		.destaque{
			background-color: #ffeb3b;
			padding: 2px 6px;
			color: #333;
		}
		
		a{
			width: 500px;
			height: 200px;
			background-color: #e0e0e0;
		}
	
	</style>

</head>

<body>
	<h1>Elementos Inline do HTML</h1>
	<p>
		Este é um parágrafo comum (elemento block). Mas se eu quiser
		destacar apenas <span class="destaque">esta palavra específica</span> ou
		adicionar um link para o <a href="https://w3.org" target="_blanck">Site do
		W3C</a>, eu utilizo tags inline. Note que o texto fica fluindo na mesma
		linha normalmente.
	
	</p>

	
	
	

</body>


</html>
